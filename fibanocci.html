<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fibonacci</title>
</head>
<body>
    <script>
        let n = 7;
        let first = 0;
        let second = 1;
        document.write(first," ",second);
        for(let i=2;i<n;i++){
            let next=first+second;
            document.write(next ," ");
            first=second;
            second=next;
        }

    </script>
</body>
</html>
