<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript</title>
</head>
<body>
    <script>
        let a = 20;
        let b = 40;
        document.write("sum:", a+b,"<br>")
        document.write("Subtract:", a-b,"<br>")
        document.write("Multiply :", a*b,"<br>")
        document.write("Division :", a/b,"<br>")
        document.write("Modulus :", a%b,"<br>")
        
    </script>
</body>
</html>
