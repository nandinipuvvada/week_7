<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>armstrong</title>
</head>
<body>
    <script>
        let s = 38;
        let original = s;
        let temp = s;
        let digit = 0;
        while (temp > 0) 
    {
        digit++;
        temp = Math.floor(temp / 10);
    }
    temp = original;
    let sum = 0;
    while (temp > 0){
        let rem = temp % 10;
        sum += Math.pow(rem, digit);
        temp = Math.floor(temp / 10);
    }
    if (sum === original)
    {
        document.write("Armstrong");
    } else {
        document.write("Not Armstrong");
    }
    </script>
</body>
</html>
